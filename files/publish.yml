name: Publish college football TV grid

on:
  schedule:
    # Daily, 11:00 UTC (7am Eastern in summer, 6am once DST ends).
    # Daily rather than weekly on purpose: networks assign kickoff windows on
    # six- and twelve-day selection, so a page built only on Monday goes wrong
    # mid-week. GitHub queues scheduled jobs on shared runners and can delay
    # them under load; nothing here is time-critical.
    - cron: "0 11 * * *"
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      date:
        description: "First Saturday (YYYY-MM-DD). Blank = the next one."
        required: false
      weeks:
        description: "How many Saturdays to bake in"
        default: "3"
      deploy:
        description: "Publish to Firebase Hosting"
        type: boolean
        default: true

# Two runs deploying at once would race. Let the newer one win.
concurrency:
  group: cfb-grid
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # build.py is standard library only on Linux — nothing to install.
      - name: Build the grid
        run: |
          python build.py \
            --weeks ${{ inputs.weeks || '3' }} \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      # Same guard as the local deploy: refuse to run if .firebaserc would send
      # this to the project default site, where the Family Dashboard lives.
      - name: Verify the deploy target
        if: github.event_name != 'workflow_dispatch' || inputs.deploy
        run: python check_target.py

      - name: Publish to Firebase Hosting
        if: github.event_name != 'workflow_dispatch' || inputs.deploy
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not set"; exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy \
            --only hosting:cfb \
            --project "$PROJECT" \
            --non-interactive \
            --message "build $(date -u +%F)"
          rm -f "$RUNNER_TEMP/sa.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schedule
          path: |
            public/index.html
            public/schedule.json
          retention-days: 14
